[project]
name = "harvix-synth"
version = "0.1.0"
description = "Synthetic tomato-harvesting dataset generator for the Harvix robot (Blender, headless)"
requires-python = ">=3.11"
# Blender bundles numpy; tests need it outside Blender too.
dependencies = ["numpy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
